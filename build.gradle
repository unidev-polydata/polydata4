plugins {
    id 'io.freefair.lombok' version '8.14' apply false
    id 'com.palantir.git-version' version '3.3.0'
}

println 'Building version: ' + gitVersion()

subprojects {

    group = 'com.unidev.polydata4'
    version = gitVersion()

    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'

    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://mvn.universal-development.com/public"
        }
    }

    dependencies {
        testImplementation "org.mockito:mockito-core:${mokitoVersion}"
        testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
        testImplementation "org.assertj:assertj-core:${assertjCoreVersion}"

        testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
        testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"

        testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    idea {
        module {
            downloadSources = true
        }
    }

    // polydata-model stays on Java 8 to remain consumable by Java 8 downstream
    // projects. All other modules move to Java 25.
    if (project.name == 'polydata-model') {
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    } else {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }

    lombok {
        version = lombokVersion
    }

    tasks.withType(Copy).configureEach { duplicatesStrategy = 'exclude' }

    // docker-java defaults to API v1.32 which Docker 25+ rejects.
    // Apply to every Test task (test, itest, ...) so Testcontainers can connect.
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        def dockerApi = System.getenv().getOrDefault('DOCKER_API_VERSION', '1.44')
        systemProperty 'api.version', dockerApi
        environment 'DOCKER_API_VERSION', dockerApi
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
    }
}
