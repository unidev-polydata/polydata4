plugins {
    // Auto-provisions JDK toolchains (e.g. Java 25) from foojay's discovery API.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'polydata4'

include(
        "polydata-api",
        "polydata-model",
        "polydata-mongodb",
        "polydata-factory",
        "polydata-redis",
        "polydata-flat-files",
        "polydata-sqlite",
        "polydata-postgresql",
        "polydata-aws-dynamodb",
        "polydata-aws-s3",
        "polydata-gcp-datastore",
)
